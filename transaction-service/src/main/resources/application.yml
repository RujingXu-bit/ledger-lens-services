spring:
  application:
    name: transaction-service

  # No hard-coded production values. Spring Boot maps SPRING_DATASOURCE_URL,
  # SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD onto these keys
  # automatically, which is how Container Apps and Kubernetes will inject them
  # in week 2. What is written here is only the local docker-compose default.
  datasource:
    url: jdbc:postgresql://localhost:5433/ledgerlens
    username: ledgerlens
    password: ledgerlens

  # Flyway runs every migration in db/migration before Hibernate looks at the
  # schema, on every start, in every environment. The alternative - a human
  # remembering to run DDL before a deploy - is the alternative that fails.
  flyway:
    enabled: true

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks its entities match it and
      # refuses to start if they do not. Never `update` outside a toy: it
      # silently alters production tables and cannot drop or rename anything.
      ddl-auto: validate
    # Off by default in production code: open-session-in-view keeps a database
    # connection held for the whole request and hides lazy-loading bugs.
    open-in-view: false

  jackson:
    serialization:
      # Write 1234.5600 rather than 1.23456E+3. Some JSON parsers turn
      # exponent-notation numbers into floats, which is how rounding errors
      # get into money.
      write-bigdecimal-as-plain: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Splits /actuator/health into /health/liveness and /health/readiness.
      # Kubernetes probes point at those two on day 12.
      probes:
        enabled: true
      show-details: when-authorized
  info:
    # Surfaces the build version and Git-free build timestamp at /actuator/info.
    build:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    # The machine-readable contract. Committed to docs/openapi/ as well, so a
    # change to the API shows up as a diff in review rather than as a surprise
    # for whoever calls it.
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # Actuator is operational surface, not part of the published API.
  show-actuator: false
