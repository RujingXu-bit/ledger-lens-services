# Local development dependencies only.
# The services themselves are containerised on day 8; until then they run from
# the IDE or `mvn spring-boot:run` against this Postgres.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerlens-postgres
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ledgerlens
    ports:
      # 5433 on the host: port 5432 is already taken by another Postgres on this
      # machine. Inside the container network it is still 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
