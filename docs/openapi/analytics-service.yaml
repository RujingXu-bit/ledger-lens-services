openapi: 3.1.0
info:
  title: Ledger Lens — analytics-service
  description: |
    Portfolio performance measurement. Owns no data: it reads the ledger and the
    price history from transaction-service and derives everything on request.

    **What a consumer needs to know before trusting a number here:**

    * **Returns are time-weighted.** External cash flows are removed before each
      day's return is measured, so a contribution is never mistaken for
      performance. `returnMethod` states this in every response, because a
      time-weighted figure and a money-weighted one are not comparable and
      nothing else in the payload would tell you which you had.
    * **Deposits and withdrawals are external; dividends are not.** A dividend
      is return the portfolio earned, so netting it out would erase the
      performance it represents.
    * **Maximum drawdown is measured on the return index, not on portfolio
      value.** A withdrawal lowers value without losing anyone a cent.
    * **`sharpeRatio` is null when volatility is zero** — undefined rather than
      infinite — and `riskFreeRate` is echoed back on every response, because a
      Sharpe ratio without its risk-free rate is not comparable to anything.
    * **`stale` may be true.** When transaction-service cannot be reached, the
      last successful result is served rather than an error, marked
      `"stale": true` with the `computedAt` it was calculated at, and with
      `Cache-Control: no-store`. Past the staleness tolerance the request gets
      `503` instead. Check the flag before acting on the figures.
    * **`503` is not `500`.** It means this service is fine but its upstream is
      not, so retrying may work. `404` is never used for an outage.

    Rates are decimal fractions, not percentages: `0.158612` is 15.86%.
  contact:
    name: Ledger Lens
    url: https://github.com/
  license:
    name: MIT
  version: v1
servers:
- url: http://localhost:8082
  description: Generated server url
tags:
- name: Performance
  description: "Return, volatility, maximum drawdown and the Sharpe ratio"
paths:
  /api/v1/portfolios/{portfolioId}/performance:
    get:
      tags:
      - Performance
      summary: Measure a portfolio's performance over a window
      description: |
        Fetches the ledger and the price history from transaction-service, rebuilds the
        daily net asset value, and derives all four figures from one daily return series.

        Nothing is stored. Two calls with the same arguments give the same answer unless
        a transaction or a price changed in between — or unless the second one was served
        from the fallback cache, in which case `stale` is `true`.

        **Reading the response:** `endingValue` growing faster than `totalReturn` is normal
        and is the point of the time-weighted method — the difference is money paid in.
      operationId: performance
      parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        description: Inclusive start. Defaults to the date of the first transaction.
        required: false
        schema:
          type: string
          format: date
        example: 2026-01-01
      - name: to
        in: query
        description: Inclusive end. Defaults to today.
        required: false
        schema:
          type: string
          format: date
        example: 2026-08-25
      - name: riskFreeRate
        in: query
        description: "Annualised, as a decimal fraction: 0.025 is 2.5%. Defaults to\
          \ zero, and is echoed back so the assumption travels with the Sharpe ratio."
        required: false
        schema:
          type: number
          default: 0
          maximum: 1.0
          minimum: -0.1
        example: 0.025
      responses:
        "200":
          description: Measured. May be a cached result — check `stale`.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerformanceResponse"
        "404":
          description: "The portfolio has no transactions. A definite answer, never\
            \ returned because an upstream was unreachable."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "Not enough valuation points to compute a statistic, or a position\
            \ held on a day with no known price."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: transaction-service could not be reached and no recent result
            was available to fall back on. Carries `Retry-After`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    ProblemDetail:
      description: "RFC 9457 problem detail, the same format transaction-service uses."
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier for the kind of problem; safe to branch on.
        title:
          type: string
        status:
          format: int32
        detail:
          type: string
          description: Prose — do not parse.
        instance:
          type: string
    PerformanceResponse:
      type: object
      properties:
        portfolioId:
          type: string
          format: uuid
        from:
          type: string
          format: date
          description: First valuation date actually used
        to:
          type: string
          format: date
          description: Last valuation date actually used
        observations:
          type: integer
          format: int32
          description: Number of daily returns behind the statistics — one fewer than
            the number of valuation days
          example: 179
        startingValue:
          type: number
          description: Net asset value on the first day
          example: 49997.0
        endingValue:
          type: number
          description: "Net asset value on the last day. Includes money paid in during\
            \ the window, which is why it is not `startingValue x (1 + totalReturn)`."
          example: 70712.2276
        totalReturn:
          type: number
          description: "Cumulative time-weighted return as a decimal fraction: 0.158612\
            \ is 15.86%"
          example: 0.158612
        annualisedReturn:
          type: number
          description: "Geometric, scaled by 252 trading days"
          example: 0.230306
        annualisedVolatility:
          type: number
          description: "Sample standard deviation of daily returns, scaled by sqrt(252)"
          example: 0.138144
        maxDrawdown:
          type: number
          description: Worst peak-to-trough fall of the return index. Zero or negative.
          example: -0.070159
        sharpeRatio:
          type:
          - number
          - "null"
          description: "Null when volatility is zero — undefined, not infinite"
          example: 1.667139
        riskFreeRate:
          type: number
          description: "The rate used, as supplied"
          example: 0
        returnMethod:
          type: string
          description: "Always TIME_WEIGHTED. Stated so nobody has to guess which\
            \ convention produced the number, or compare it against one that used\
            \ the other."
          enum:
          - TIME_WEIGHTED
          example: TIME_WEIGHTED
        stale:
          type: boolean
          description: True when transaction-service was unreachable and this is the
            last successful result. Check it before acting on the figures.
          example: false
        computedAt:
          type: string
          format: date-time
          description: When these figures were calculated
