# Azure DevOps pipeline: verify -> package -> deploy -> prove it works.
#
# Four stages rather than one job, because they fail for different reasons and
# you want to see which. A red "Verify" is a code problem; a red "Smoke test" is
# a deployment problem, and the difference is the first thing you want to know
# at 9am.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# ---------------------------------------------------------------------------
# On the absence of service connections
#
# There are none, and that is forced rather than chosen. An Azure Resource
# Manager service connection authenticates with a service principal, which is an
# app registration - and the Entra tenant this subscription lives in sets
# `allowedToCreateApps: false` for ordinary users. The account is Owner of the
# subscription and holds no directory role, so it can create any resource and no
# identity to manage them with. A tenant administrator would have to grant it.
#
# The way around it: the agent is self-hosted, on a machine where `az login` has
# already happened, so every Azure step runs as that signed-in user.
#
# The cost of that, stated plainly rather than buried: the pipeline then acts
# with a human's credentials and this human is subscription Owner, which is far
# more authority than a deploy needs. A scoped service principal - or workload
# identity federation, which hands out no long-lived secret at all - is the right
# answer, and both are one tenant-admin approval away. It also means a pipeline
# run fails when that login expires, which is a worse failure mode than a secret
# rotating on a schedule.
#
# It has one incidental benefit: nothing here depends on the Azure DevOps
# organisation living in the same tenant as the subscription.
# ---------------------------------------------------------------------------

# Which agent runs this.
#
# Self-hosted by default, and that is not a fallback - it is the option that
# does not require linking this Azure DevOps organisation to the Azure
# subscription. Microsoft's own documentation lists Azure DevOps Services among
# the things that can exhaust a subscription's spending limit, and the
# subscription behind this project is a student grant with a hard cap. The
# self-hosted free tier is granted automatically, has no monthly minute limit,
# and costs nothing.
#
# The trade-off, stated plainly: a self-hosted agent only runs while the machine
# hosting it is on. Flip this parameter once hosted parallelism is available.
# Literal, because the root `pool` context accepts no template expression at
# all - not a conditional, and not a parameter either. Two attempts confirmed
# it:
#
#   (Line: 66) A template expression is not allowed in this context   # ${{ if }}
#   (Line: 77) A template expression is not allowed in this context   # ${{ parameters.x }}
#
# Being able to select the agent from a parameter was worth less than a file
# that runs. To move to Microsoft-hosted agents, replace this block with:
#
#   pool:
#     vmImage: ubuntu-latest
#
# and add `JAVA_HOME: $(JAVA_HOME_21_X64)` to the variables below - hosted
# Ubuntu images expose each installed JDK that way, and pinning it beats hoping
# the default happens to be 21.
pool:
  name: Default

variables:
  # Set once, used by every stage. The registry and resource group are the ones
  # created on day 9; the service connections are created in the Azure DevOps
  # UI and named here.
  - name: acrLoginServer
    value: acrledgerlens79829b.azurecr.io
  - name: resourceGroup
    value: rg-ledgerlens

stages:

  # ---------------------------------------------------------------------------
  - stage: Verify
    displayName: Build and test
    jobs:
      - job: Maven
        displayName: mvn verify
        steps:
          - checkout: self
            fetchDepth: 1

          - script: echo "##vso[task.setvariable variable=shortSha;isOutput=true]$(git rev-parse --short HEAD)"
            name: meta
            displayName: Resolve the image tag from the commit

          # Printed before anything uses them, because on a self-hosted agent
          # the environment is whatever the service manager decided rather than
          # whatever the terminal has. A launchd agent on macOS starts with
          # PATH=/usr/bin:/bin:/usr/sbin:/sbin, so Homebrew, the JDK and the
          # Docker CLI are all invisible until the agent's `.path` file names
          # them. When that is wrong the symptom is "command not found" for
          # something that plainly works in a shell, and this step turns ten
          # minutes of confusion into one line of output.
          - script: |
              echo "PATH=$PATH"
              echo "JAVA_HOME=${JAVA_HOME:-(unset - the Maven wrapper falls back to java on PATH)}"
              java -version
              docker --version && docker info --format 'docker daemon: {{.ServerVersion}}'
              az account show --query "{subscription:name, user:user.name}" -o tsv
            displayName: Show the toolchain this agent actually has

          # Keyed on the POMs, so it is reused for every commit that does not
          # change a dependency - which is nearly all of them.
          - task: Cache@2
            displayName: Cache the Maven repository
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(HOME)/.m2/repository

          # The tests run here exactly as they run on a laptop. Nothing is
          # skipped and nothing is weakened: Testcontainers starts a real
          # PostgreSQL because the hosted agent has a Docker daemon, and
          # WireMock needs nothing but a port. A CI run that quietly drops the
          # database tests is a CI run that proves less than it appears to.
          - script: ./mvnw -B verify
            displayName: Build and run all tests

          # Published separately so a failure is a list of test names in the UI
          # rather than something you go hunting for in 2,000 lines of log.
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true

  # ---------------------------------------------------------------------------
  - stage: Package
    displayName: Build and push images
    dependsOn: Verify
    condition: succeeded()
    variables:
      shortSha: $[ stageDependencies.Verify.Maven.outputs['meta.shortSha'] ]
    jobs:
      - job: Images
        displayName: Push to ACR
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -euo pipefail
              az account show >/dev/null 2>&1 || {
                echo "The agent's Azure CLI is not signed in. Run 'az login' on the agent host." >&2
                exit 1
              }
              echo "signed in as: $(az account show --query user.name -o tsv)"
            displayName: Check the agent can reach Azure

          # Both images are built from the repository root, because each
          # Dockerfile needs the parent POM and the Maven wrapper above it.
          #
          # The image is tagged with the commit, never `latest`: a moving tag
          # means "which build is in production" has no answer and a rollback
          # has nothing to roll back to.
          #
          # --platform linux/amd64 matters when the agent is an Apple Silicon
          # machine, which is exactly the case a self-hosted agent creates here.
          # The Dockerfile pins only its build stage to the host architecture,
          # so this cross-build costs seconds rather than emulating Maven.
          - script: |
              set -euo pipefail
              az acr login --name ${ACR%%.*}
              for svc in transaction-service analytics-service; do
                echo "--- $svc ---"
                docker buildx build --platform linux/amd64 \
                  -f "$svc/Dockerfile" \
                  -t "$ACR/$svc:0.1.0-$(shortSha)" \
                  --push .
              done
            displayName: Build and push both images
            env:
              ACR: $(acrLoginServer)

  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn:
      - Verify
      - Package
    # Pull requests build and test, but only main deploys. Without this
    # condition every PR would deploy itself over production.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      shortSha: $[ stageDependencies.Verify.Maven.outputs['meta.shortSha'] ]
    jobs:
      # A deployment job rather than a plain job: Azure DevOps then records a
      # deployment history against the environment - what went out, when, from
      # which commit - which is the record you want when something breaks.
      - deployment: ContainerApps
        displayName: Update both revisions
        environment: ledgerlens-production
        strategy:
          runOnce:
            deploy:
              steps:
                # transaction-service first. analytics depends on it, so if the
                # ledger fails to start it is better to find out before the
                # thing that calls it has been replaced too.
                - script: |
                    set -euo pipefail
                    az containerapp update \
                      --name transaction-service \
                      --resource-group $(resourceGroup) \
                      --image $(acrLoginServer)/transaction-service:0.1.0-$(shortSha)
                  displayName: transaction-service

                - script: |
                    set -euo pipefail
                    az containerapp update \
                      --name analytics-service \
                      --resource-group $(resourceGroup) \
                      --image $(acrLoginServer)/analytics-service:0.1.0-$(shortSha)
                  displayName: analytics-service

  # ---------------------------------------------------------------------------
  - stage: SmokeTest
    displayName: Prove the deployment works
    dependsOn: Deploy
    condition: succeeded()
    variables:
      shortSha: $[ stageDependencies.Verify.Maven.outputs['meta.shortSha'] ]
    jobs:
      - job: Smoke
        displayName: Hit the public endpoint
        steps:
          - checkout: none

          # "Deployed successfully" only means the platform accepted a new
          # revision. This asks the running system a question and checks the
          # answer, which is the difference between deploying and knowing.
          #
          # Generous timeouts on purpose: both apps scale to zero, so the first
          # request pays for two JVM starts.
          - script: |
              set -euo pipefail
              URL="https://$(az containerapp show \
                --name analytics-service --resource-group $(resourceGroup) \
                --query properties.configuration.ingress.fqdn -o tsv)"
              echo "target: $URL"

              echo "waiting for readiness (cold start)"
              for i in $(seq 1 30); do
                curl -sf --max-time 60 "$URL/actuator/health/readiness" >/dev/null && break
                sleep 10
              done
              curl -sf --max-time 60 "$URL/actuator/health/readiness"

              # The deployed build must be the build this pipeline produced.
              # Without this check a failed rollout looks identical to a
              # successful one: the old revision answers happily.
              echo "verifying the running revision came from this commit"
              RUNNING=$(az containerapp show --name analytics-service \
                --resource-group $(resourceGroup) \
                --query "properties.template.containers[0].image" -o tsv)
              echo "running image: $RUNNING"
              case "$RUNNING" in
                *:0.1.0-$(shortSha)) echo "matches this build" ;;
                *) echo "deployed image is not this build" >&2; exit 1 ;;
              esac

              # Proving the inter-service call works, without depending on any
              # particular data being present.
              #
              # A random portfolio id must come back 404, and only the full
              # chain can produce that: analytics has to reach
              # transaction-service over internal ingress and be told the
              # ledger is empty. If the ledger were unreachable the answer
              # would be 503, and if analytics itself were broken it would be
              # 5xx. Asserting on seeded data instead would make this stage
              # fail whenever someone reset the database - a false alarm that
              # trains people to ignore the alarm.
              echo "exercising the call chain with a portfolio that cannot exist"
              CODE=$(curl -s -o /tmp/probe.json -w '%{http_code}' --max-time 120 \
                "$URL/api/v1/portfolios/$(uuidgen | tr 'A-Z' 'a-z')/performance")
              echo "status: $CODE"
              cat /tmp/probe.json; echo
              if [ "$CODE" != "404" ]; then
                echo "expected 404 from a healthy chain; a 503 means transaction-service is unreachable" >&2
                exit 1
              fi
              grep -q '"title":"Portfolio not found"' /tmp/probe.json

              echo
              echo "smoke test passed"
            displayName: Health, running version, and a real call through the chain
