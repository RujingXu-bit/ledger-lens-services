spring:
  lifecycle:
    # How long graceful shutdown may take before the JVM stops regardless. Must
    # stay comfortably under the pod's terminationGracePeriodSeconds, or
    # Kubernetes SIGKILLs the process mid-drain and the setting achieves nothing.
    timeout-per-shutdown-phase: 20s

  application:
    name: analytics-service

server:
  port: 8082
  # Finish in-flight requests instead of dropping them when the container is
  # asked to stop. Without this, SIGTERM closes the connector immediately and a
  # rolling update loses whatever was mid-request.
  shutdown: graceful

# Where transaction-service lives. localhost for now; a compose service name on
# day 8, a Container Apps internal FQDN on day 10, a Kubernetes Service name on
# day 12. Only this one value changes across all four environments.
ledgerlens:
  openapi:
    # The address the published contract names as the live server. Overridable
    # per environment; the default is the deployment this repository documents.
    public-url: https://analytics-service.icywater-fe129bae.francecentral.azurecontainerapps.io

  transaction-service:
    base-url: http://localhost:8081
    # Short on purpose. A call with no timeout inherits the operating system's,
    # which is minutes; under load every thread here ends up parked on a dead
    # upstream and one service's outage becomes two.
    connect-timeout: 2s
    read-timeout: 5s
    # Total attempts including the first. Retries are load amplification, so
    # this stays at two: enough to absorb one dropped connection during a
    # rolling deploy, not enough to turn an upstream slowdown into an outage.
    max-attempts: 2
    # How old a cached result may be and still be served during an outage.
    # Past this, an error is more honest than a stale number.
    stale-tolerance: 15m
    # Transactions per request when reading a ledger, capped at what
    # transaction-service will serve. The client pages until the ledger is
    # exhausted rather than using whatever fits in one response.
    page-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # Left at the default on purpose, which is the interesting half of the
      # pair. This service could report itself not-ready when
      # transaction-service is unreachable, and that would be wrong: it can
      # still serve a clearly-labelled cached result, and an honest 503 when it
      # cannot. Making it unready would remove it from its own Service and
      # convert one service's outage into two - the exact failure the timeouts
      # and the fallback cache exist to prevent.
      #
      # Readiness means "can I do my job", and this service's job includes
      # degrading well.
  info:
    # Surfaces the build version and Git-free build timestamp at /actuator/info.
    build:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    # The machine-readable contract. Committed to docs/openapi/ as well, so a
    # change to the API shows up as a diff in review rather than as a surprise
    # for whoever calls it.
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # Actuator is operational surface, not part of the published API.
  show-actuator: false
